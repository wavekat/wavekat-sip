; Asterisk test server for wavekat-sip's end-to-end tests (`make e2e-asterisk`).
; Two accounts, alice and bob, over UDP and TCP on 5060. Not for production:
; the passwords are in this file on purpose.

[global]
type=global
user_agent=wavekat-sip-e2e

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; Shared by both accounts. The tests reach Asterisk through Docker's port
; mapping, so the address in a client's Contact is not one Asterisk can
; reach: rewrite it to where the request came from, and answer there.
[e2e-endpoint](!)
type=endpoint
context=e2e
disallow=all
allow=ulaw,alaw
direct_media=no
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes

[e2e-aor](!)
type=aor
max_contacts=1
remove_existing=yes

[alice](e2e-endpoint)
auth=alice
aors=alice
[alice](e2e-aor)
[alice]
type=auth
auth_type=userpass
username=alice
password=alice-e2e

[bob](e2e-endpoint)
auth=bob
aors=bob
[bob](e2e-aor)
[bob]
type=auth
auth_type=userpass
username=bob
password=bob-e2e
