[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
# Cargo's 0.0.x range matching is strict — keep version == published while
# downstream consumers pin us via [patch.crates-io] to a specific 0.0.x.
# Bump only when the in-flight port (see docs/01-port-plan.md) is ready
# to publish.
version = "0.0.14"
edition = "2021"
license = "Apache-2.0"
